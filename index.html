            padding: 48px 40px;

            font-size: 36px;

        .button { 
            background: linear-gradient(135deg, #0095f6, #007bb5); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            height: 48px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 12px rgba(0,149,246,0.3);

        }
        .button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,149,246,0.4); }

        .button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .status { font-size: 14px; color: #8e8e8e; min-height: 20px; font-weight: 500; }
        .debug {

            background: rgba(0,0,0,0.9); color: #0f0; padding: 15px; 
            font-family: 'Courier New', monospace; font-size: 13px; 
            max-width: 380px; max-height: 280px; overflow: auto; 
            border-radius: 8px; z-index: 9999; 
        }
        @media (max-width: 480px) { .container { margin: 20px; padding: 32px 24px; } }
    </style>
